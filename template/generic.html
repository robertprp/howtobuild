<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light" />
    <title>{{{TITLE}}} — HowToBuild.dev</title>
  </head>
  <body style="margin: 0; padding: 0; background: #e9e3d5; color: #1d211d">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0">
      {{{PREHEADER}}}
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="width: 100%; background: #e9e3d5"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              max-width: 600px;
              border: 1px solid #1d211d;
              background: #f4f0e6;
            "
          >
            <tr>
              <td style="padding: 24px 28px; border-bottom: 1px solid #1d211d">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td width="48" style="width: 48px; vertical-align: middle">
                      <img
                        src="https://howtobuild.dev/assets/howtobuild-mark.png"
                        width="40"
                        height="40"
                        alt=""
                        style="
                          display: block;
                          width: 40px;
                          height: 40px;
                          border: 0;
                        "
                      />
                    </td>
                    <td
                      style="
                        vertical-align: middle;
                        font-family: Georgia, 'Times New Roman', serif;
                        font-size: 21px;
                        font-weight: bold;
                        letter-spacing: -0.4px;
                      "
                    >
                      HowToBuild<span style="color: #b9472d">.dev</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 48px 44px 20px">
                <p
                  style="
                    margin: 0 0 16px;
                    color: #b9472d;
                    font-family: 'Courier New', monospace;
                    font-size: 11px;
                    font-weight: bold;
                    letter-spacing: 1.3px;
                    line-height: 16px;
                    text-transform: uppercase;
                  "
                >
                  Private editorial workspace
                </p>
                <h1
                  style="
                    margin: 0 0 22px;
                    color: #1d211d;
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 42px;
                    font-weight: bold;
                    letter-spacing: -1.5px;
                    line-height: 45px;
                  "
                >
                  {{{TITLE}}}
                </h1>
                <p
                  style="
                    margin: 0;
                    color: #3f453e;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 17px;
                    line-height: 27px;
                  "
                >
                  {{{INTRO}}}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 22px 44px 34px">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="
                    border: 1px solid #1d211d;
                    border-left: 7px solid #b9472d;
                    background: #fffaf0;
                  "
                >
                  <tr>
                    <td style="padding: 24px 26px">
                      <p
                        style="
                          margin: 0 0 10px;
                          color: #65685f;
                          font-family: 'Courier New', monospace;
                          font-size: 10px;
                          font-weight: bold;
                          letter-spacing: 1.2px;
                          line-height: 15px;
                          text-transform: uppercase;
                        "
                      >
                        {{{CODE_LABEL}}}
                      </p>
                      <p
                        style="
                          margin: 0;
                          color: #1d211d;
                          font-family: 'Courier New', monospace;
                          font-size: 34px;
                          font-weight: bold;
                          letter-spacing: 8px;
                          line-height: 44px;
                        "
                      >
                        {{{CODE}}}
                      </p>
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 18px 0 0;
                    color: #65685f;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 13px;
                    line-height: 21px;
                  "
                >
                  This code expires shortly and can be used once. Never share it
                  with anyone, including HowToBuild.dev staff.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 24px 44px;
                  border-top: 1px solid #c9c1b2;
                  background: #1d211d;
                "
              >
                <p
                  style="
                    margin: 0;
                    color: #f4f0e6;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 12px;
                    line-height: 19px;
                  "
                >
                  {{{FOOTER}}}
                </p>
                <p
                  style="
                    margin: 12px 0 0;
                    color: #aeb2a9;
                    font-family: 'Courier New', monospace;
                    font-size: 10px;
                    line-height: 16px;
                  "
                >
                  HOWTOBUILD.DEV · INDEPENDENT DEVELOPER FIELD GUIDE
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
